      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/furnaces/{furnaceId}/resets:
    parameters: [{ $ref: '#/components/parameters/FurnaceId' }]
    post:
      tags: [Public]
      operationId: resetFurnace
      summary: 管理员备用复位接口；正常界面由系统自动复位，无需点击
      description: 请求立即入队；系统最多等待十五秒取得新鲜炉门状态并等待旧命令到期，随后自动关门、复位，以设备匹配反馈中止周期。不要求入口传感器为空或其他设备在线，不将未完成周期记为成功。
      x-required-role: admin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorAction' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/cycles:
    get:
      tags: [Public]
