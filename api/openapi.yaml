      required: [commandId, cycleId, deviceId, furnaceId, targetBootId, action, issuedAt, expiresAt]
      properties:
        commandId: { type: string, format: uuid }
        cycleId: { type: string }
        deviceId: { type: string }
        furnaceId: { type: string }
        temperatureC: { type: number, format: double, description: SET_TEMPERATURE 必填，摄氏度 }
        targetBootId: { type: string, format: uuid }
        action: { type: string, enum: [OPEN, CLOSE, RESET, ALARM_ON, ALARM_OFF, SET_TEMPERATURE] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
