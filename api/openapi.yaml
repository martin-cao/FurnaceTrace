      type: object
      required: [deviceId, furnaceId, kind, online, reason, state]
      properties:
        deviceId: { type: string }
        furnaceId: { type: string }
        kind: { type: string, enum: [sensor, door, lamp, temperature] }
        online: { type: boolean }
        reason: { type: string }
        state:
          allOf: [{ $ref: '#/components/schemas/DeviceState' }]
          nullable: true
    DeviceCommand:
      oneOf:
        - properties: { action: { enum: [SET_TEMPERATURE] } }
          required: [temperatureC]
        - properties: { action: { enum: [OPEN, CLOSE, RESET, ALARM_ON, ALARM_OFF] } }
      description: SET_TEMPERATURE 由 FUXA 现场输入生成，只用于温度模拟器，必须提供有限的 temperatureC；保留启动编号、有效期和去重约束。
