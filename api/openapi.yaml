openapi: 3.0.3
info:
  title: Furnace Trace 入炉追溯 API
  version: 0.7.2
  description: |
    公共 API 由 core 提供，除登录/注册外需要 HttpOnly Cookie 会话。
    内部路径的 x-service 标识实际提供该接口的独立服务，使用服务 Bearer Token。
    普通用户共享只读生产视图，只能管理自己的 Telegram 绑定、偏好和投递记录。
    补录、复位、报警确认与 FUXA 网页入口要求 admin 角色。时间均为 UTC RFC3339。
    状态变更接口要求 Idempotency-Key：同一路径、同一键、同一 JSON 内容返回原响应；
    同一键不同内容返回 409。数据库唯一约束保证并发请求只有一个生效。
    通用幂等键还包含当前用户作用域。登录/注册、偏好或温度相关 PUT、解绑及配对接口不使用此键；
    配对码按单次原子消费处理，同一用户对仍存在的同一绑定重试返回当前绑定。
    已提交的幂等记录保留到显式重置演示数据；未完成记录不得按超时重新执行。
    202 只表示已接收，不能解释为设备执行完成。设备完成必须匹配 commandId 与 bootId。
    core 不访问 MQTT，所有设备状态和控制必须经 FUXA 与 scada-adapter。
    扫码/MES 拒绝或流程异常后自动排队关门、复位，匹配设备反馈后以 ABORTED 归档并恢复持续扫码；
    无需人工点击复位。设备尚未恢复时自动等待和重试关闭/复位，绝不补发新的开门命令。
servers:
  - url: /
security:
  - SessionCookie: []
tags:
  - name: Public
  - name: CoreInternal
  - name: SCADA
  - name: Vision
  - name: Notifications
  - name: MES
  - name: Simulation
  - name: Accounts
  - name: PersonalNotifications
paths:
  /api/v1/batches:
    get:
      tags:
      - MES
      operationId: listBatchRecords
      summary: 分页查询未删除的台账记录
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 80
    post:
      tags:
      - MES
      operationId: createBatch
      summary: 管理员创建台账记录；编号不能与历史已删除记录重复
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
  /api/v1/batches/{batchId}:
    parameters:
    - $ref: '#/components/parameters/BatchId'
    get:
      tags:
      - MES
      operationId: getBatch
      summary: 查询单条台账
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      tags:
      - MES
      operationId: updateBatch
      summary: 管理员修改台账；版本过期或关联活动周期时返回 409
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdate'
    delete:
      tags:
      - MES
      operationId: deleteBatch
      summary: 管理员逻辑删除台账，保留编号与追溯；料筐占用/使用中或批次仍关联料筐时拒绝
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDelete'
  /api/v1/baskets:
    get:
      tags:
      - MES
      operationId: listBasketRecords
      summary: 分页查询未删除的台账记录
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 80
      - name: batchId
        in: query
        schema:
          type: string
          format: uuid
    post:
      tags:
      - MES
      operationId: createBasket
      summary: 管理员创建台账记录；编号不能与历史已删除记录重复
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketInput'
  /api/v1/baskets/{basketNo}:
    parameters:
    - $ref: '#/components/parameters/BasketNo'
    get:
      tags:
      - MES
      operationId: getBasket
      summary: 查询单条台账
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      tags:
      - MES
      operationId: updateBasket
      summary: 管理员修改台账；版本过期或关联活动周期时返回 409
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketUpdate'
    delete:
      tags:
      - MES
      operationId: deleteBasket
      summary: 管理员逻辑删除台账，保留编号与追溯；料筐占用/使用中或批次仍关联料筐时拒绝
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDelete'
  /api/v1/baskets/{basketNo}/qrcode:
    parameters:
    - $ref: '#/components/parameters/BasketNo'
    get:
      tags:
      - MES
      operationId: basketQRCode
      summary: 生成普通 QR Code PNG，码内容为完整料筐编号，不代表放行凭证
      responses:
        '200':
          description: 二维码标签
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/alarm-rules:
    get:
      tags:
      - AlarmRules
      operationId: listAlarmRules
      summary: 查询所有未删除的自定义规则及其活动状态（最多 100 条）；普通用户只读
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlarmRule'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - AlarmRules
      operationId: createAlarmRule
      summary: 创建自定义报警规则；条件最多嵌套 4 层、16 个叶子条件
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRuleInput'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/alarm-rules/{ruleId}:
    parameters:
    - name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - AlarmRules
      operationId: updateAlarmRule
      summary: 修改规则与通知策略；版本过期拒绝，所属炉子不可更改
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRuleUpdate'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - AlarmRules
      operationId: deleteAlarmRule
      summary: 逻辑删除规则并终止其活动报警和后续提醒；已进入发送流程的消息可能仍到达
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDelete'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/notifications/{alarmId}/cancel-reminders:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [PersonalNotifications]
      operationId: cancelAlarmReminders
      x-service: notifier
      security: [{ ServiceToken: [] }]
      summary: 故障结束后取消待发送的重复提醒，并阻止迟到的提醒再次排队；幂等
      responses:
        '204': { description: 已结束此报警的重复提醒 }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      operationId: health
      security: []
      summary: 所有服务提供的进程存活检查
      responses:
        '200':
          description: 进程存活（不代表依赖可用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /readyz:
    get:
      operationId: ready
      security: []
      summary: 所有服务提供的就绪检查
      responses:
        '200':
          description: 能处理本服务请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/register:
    post:
      tags: [Accounts]
      operationId: register
      security: []
      summary: 自主注册普通用户并登录；请求不能指定角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      tags: [Accounts]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [Accounts]
      operationId: logout
      summary: 撤销当前持久会话并清除 Cookie
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/profile:
    put:
      tags: [Accounts]
      operationId: updateMyProfile
      summary: 修改本人用户名和显示名称，验证当前密码；用户 ID 和 Telegram 绑定不变
      description: 用户名大小写不敏感；相同内容重复 PUT 幂等。不接受角色字段。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: 更新后的本人资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/password:
    put:
      tags: [Accounts]
      operationId: changeMyPassword
      summary: 校验旧密码并修改密码，撤销本人全部会话，要求重新登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: 密码已修改，所有会话已撤销，Cookie 已清除 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/users:
    get:
      tags: [Accounts]
      operationId: listUsers
      x-required-role: admin
      summary: 管理员分页查看用户、角色和启用状态；不返回密码、会话或 Telegram 身份
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/users/{userId}/access:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      tags: [Accounts]
      operationId: updateUserAccess
      x-required-role: admin
      summary: 修改其他账户角色与启用状态；不能停用或降级最后一个管理员
      description: |
        不允许改变自己的角色/启用状态。相同内容重复 PUT 幂等。
        更改角色或启用状态后撤销目标用户全部会话；停用同时通过持久任务通知 notifier 暂停投递。
        其他权限修改事务占用锁时立即返回 409 ACCESS_UPDATE_BUSY；服务端处理上限为 5 秒，超时返回 503 ACCESS_UPDATE_TIMEOUT，客户端应查询当前状态核实结果。
        恢复启用保留原个人偏好，不补发停用期间通知。已经开始发送的消息可能仍到达。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAccessUpdate' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/furnaces/{furnaceId}/camera-config:
    parameters: [{ $ref: '#/components/parameters/FurnaceId' }]
    get:
      tags: [Public]
      operationId: getCameraConfig
      x-required-role: admin
      summary: 管理员查看已保存的完整 RTSP 地址与应用状态；响应不缓存，普通用户无权访问
      responses:
        '200':
          description: 摄像头配置状态；已应用不等于视频已连通
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraConfig' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Public]
      operationId: configureCamera
      x-required-role: admin
      summary: 保存模拟摄像头或外部 RTSP 上游，后台应用到 MediaMTX
      description: |
        有活动周期时拒绝修改。RTSP 地址加密持久化，在管理员设置页完整回显并允许编辑；仅接受 rtsp/rtsps。
        rtspUrl 省略表示保留已保存地址，首次选 rtsp 时必须提供。相同配置重复 PUT 幂等。
        应用过程禁止开启新周期；切换后留出解码重连时间。配置失败保留待应用状态，可重试或切回模拟源。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CameraConfigUpdate' }
      responses:
        '200':
          description: 配置已保存，查询 applied 和 online 区分应用与连通结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/account-access:
    put:
      tags: [PersonalNotifications]
      x-service: notifier
      operationId: syncAccountAccess
      security: [{ ServiceToken: [] }]
      summary: 按单调版本同步账号启停；忽略旧版本，停用时取消未发送通知
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountAccess' }
      responses:
        '204': { description: 已应用或已处理该版本 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [Accounts]
      operationId: currentUser
      responses:
        '200':
          description: 当前登录用户，不含密码或会话密钥
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/telegram:
    get:
      tags: [PersonalNotifications]
      operationId: myTelegram
      responses:
        '200':
          description: 本人绑定状态、Bot 链接信息及通知偏好，不暴露 Chat ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramState' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [PersonalNotifications]
      operationId: unpairTelegram
      summary: 解除本人绑定，同时取消尚未发送的该绑定通知
      responses:
        '204': { description: 已解绑；重复调用无副作用 }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/me/telegram/pair:
    post:
      tags: [PersonalNotifications]
      operationId: pairTelegram
      summary: 提交 Bot 私聊 /start 返回的配对码；有效期 10 分钟，一次性消费
      description: 一个网页账户只绑定一个 Telegram 私聊，一个 Telegram 账户不能同时绑定不同网页用户；先解绑才能换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: 配对完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/me/notification-preferences:
    put:
      tags: [PersonalNotifications]
      operationId: updateMyNotificationPreferences
      summary: 全量替换个人偏好；空炉子或类别集合表示不订阅，变更只影响尚未发送及未来通知
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/furnaces:
    get:
      tags: [Public]
      operationId: listFurnaces
      responses:
        '200':
          description: 全部已配置炉子及实时状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Furnace' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/furnaces/{furnaceId}:
    parameters: [{ $ref: '#/components/parameters/FurnaceId' }]
    get:
      tags: [Public]
      operationId: getFurnace
      responses:
        '200':
          description: 单台炉子的可恢复快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Furnace' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/furnaces/{furnaceId}/manual-scans:
    parameters: [{ $ref: '#/components/parameters/FurnaceId' }]
