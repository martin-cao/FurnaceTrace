      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/DeviceView' }
      responses:
        '204': { description: 状态已接收；不是业务完成确认 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/scan-results:
    post:
      tags: [CoreInternal]
      x-service: core
      operationId: ingestScanResult
      security: [{ ServiceToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanResult' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/v1/barcode-detections:
    post:
      tags: [CoreInternal]
      x-service: core
      operationId: ingestBarcodeDetection
      summary: 持续扫码；稳定识别即视为入口到位，空闲时创建周期并进行 MES 校验
      description: 不再要求入口 present 信号，不创建空画面超时周期。同一码停留只上报一次，移除至少三帧或换码后重新触发。活动周期内的新识别记录为忽略；过期十秒的结果不启动周期。幂等键使用 detectionId。
      security: [{ ServiceToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarcodeDetection' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/scada/devices:
    get:
      tags: [SCADA]
      x-service: scada-adapter
      operationId: scadaDevices
      security: [{ ServiceToken: [] }]
      responses:
        '200':
          description: 适配器状态快照；FUXA 缓存不代表设备在线
          content:
            application/json:
              schema:
