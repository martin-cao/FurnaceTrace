      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        ruleId: { type: string, format: uuid }
        ruleVersion: { type: integer, format: int64 }
        resolution: { type: string, enum: [condition_cleared, rule_disabled, rule_deleted, rule_migrated], description: 自定义报警结束原因，停用/删除规则不等于现场故障已消除 }
