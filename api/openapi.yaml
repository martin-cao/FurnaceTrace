        acknowledgedAt: { type: string, format: date-time, nullable: true }
        recoveredAt: { type: string, format: date-time, nullable: true }
        operator: { type: string }
    NotificationRequest:
      type: object
      required: [id, alarmId, furnaceId, kind, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        alarmId: { type: string, format: uuid }
        furnaceId: { type: string }
        kind: { type: string, enum: [ALARM, RECOVERY, REMINDER] }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    Notification:
      allOf:
        - { $ref: '#/components/schemas/NotificationRequest' }
        - type: object
          required: [status, attempts, lastError, sentAt, nextAttemptAt]
          properties:
            status: { type: string, enum: [pending, sent, failed, unknown, cancelled] }
            attempts: { type: integer, minimum: 0 }
            lastError: { type: string }
            sentAt: { type: string, format: date-time, nullable: true }
            nextAttemptAt: { type: string, format: date-time }
    MESResult:
      type: object
      required: [basketNo, result, message, reason]
      description: 从 PostgreSQL 台账校验；0 不存在，1 允许，2 禁用或质检未通过。未知编号不得放行。
      properties:
        reason: { type: string }
        snapshot:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AdmissionSnapshot' }]
        basketNo: { type: string }
        result: { type: integer, enum: [0, 1, 2] }
        message: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    CyclePage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Cycle' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    AlarmPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alarm' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    NotificationPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    StreamSnapshot:
      type: object
      required: [at, furnaces, activeAlarmCount, catalogVersion, rulesVersion]
      properties:
        rulesVersion: { type: integer, format: int64, minimum: 0, description: 自定义报警规则与活动状态版本，变化后刷新规则和报警列表 }
        catalogVersion: { type: integer, format: int64, minimum: 0, description: 持久台账版本；变化或重连后重新查询列表，不覆盖编辑草稿 }
        at: { type: string, format: date-time }
        furnaces: { type: array, items: { $ref: '#/components/schemas/Furnace' } }
        activeAlarmCount: { type: integer, minimum: 0 }
    SimulationInput:
      type: object
      additionalProperties: false
      properties:
        present: { type: boolean }
        inFurnace: { type: boolean }
        jammed: { type: boolean }
        muted: { type: boolean, description: 暂停状态发布以测试过期 }
        forceClosed: { type: boolean, description: 仅模拟人工消除卡门故障 }
    CameraScene:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          maxItems: 2
          items: { type: string, minLength: 1, maxLength: 200 }
        paused: { type: boolean, default: false }
