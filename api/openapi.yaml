        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    get:
      tags: [Public]
      operationId: eventStream
      summary: SSE 快照流；连接后立即发送快照，之后状态更新；断线重连重新获取当前快照
      responses:
        '200':
          description: event=state，data 为 StreamSnapshot JSON；不是可重放审计日志
          content:
            text/event-stream:
