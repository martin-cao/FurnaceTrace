        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/scada/commands:
    post:
      tags: [SCADA]
      x-service: scada-adapter
      operationId: writeDeviceCommand
      security: [{ ServiceToken: [] }]
      summary: 经 FUXA 发送一次；相同 commandId 可重发，由设备幂等执行
      description: 命令持久化与重试归 core 所有；适配器没有隐藏的发送队列。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCommand' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/scan-sessions:
    post:
      tags: [Vision]
      x-service: vision
      operationId: createScanSession
      security: [{ ServiceToken: [] }]
      summary: 以 sessionId 幂等创建；同时只允许一个未结束会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanSession' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/v1/camera:
    get:
      tags: [Vision]
      x-service: vision
      operationId: cameraStatus
      security: [{ ServiceToken: [] }]
      responses:
        '200':
          description: 拉流状态，不包含摄像头凭据或原始 RTSP URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraState' }
        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/notifications:
    post:
      tags: [Notifications]
      x-service: notifier
      operationId: enqueueNotification
      security: [{ ServiceToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [Notifications]
      x-service: notifier
      operationId: notificationJobs
      security: [{ ServiceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: userId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 持久通知队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/users/{userId}/telegram:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      tags: [Notifications]
      x-service: notifier
      operationId: userTelegramState
      security: [{ ServiceToken: [] }]
      responses:
        '200':
          description: 由 core 使用会话中的 userId 调用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramState' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Notifications]
      x-service: notifier
      operationId: deleteTelegramBinding
      security: [{ ServiceToken: [] }]
      responses:
        '204': { description: 绑定及未发送投递已撤销 }
        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/users/{userId}/telegram/pair:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [Notifications]
      x-service: notifier
      operationId: consumePairCode
      security: [{ ServiceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: 原子消费配对码并绑定用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramState' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /internal/v1/users/{userId}/notification-preferences:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    put:
      tags: [Notifications]
      x-service: notifier
      operationId: setUserNotificationPreferences
      security: [{ ServiceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: 本人偏好已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/mes/baskets/{basketNo}:
    parameters:
      - { name: basketNo, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    get:
      tags: [MES]
      x-service: mes
      operationId: basketEligibility
      security: [{ ServiceToken: [] }]
      responses:
        '200':
          description: result 1=允许，0=不存在，2=质量异常；通信错误使用非 2xx
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MESResult' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/sim/state:
    get:
      tags: [Simulation]
      x-service: device-sim
      operationId: simulatedDeviceState
      security: [{ ServiceToken: [] }]
      responses:
        '200':
          description: 仅测试检查设备行为，core 不使用此接口读取设备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceState' }
    patch:
      tags: [Simulation]
      x-service: device-sim
      operationId: injectDeviceScenario
      security: [{ ServiceToken: [] }]
      summary: 仅模拟环境改变物理输入/故障；不直接修改业务状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationInput' }
      responses:
        '204': { description: 输入已更新 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /internal/v1/sim/scene:
    put:
      tags: [Simulation]
      x-service: camera-sim
      operationId: setCameraScene
      security: [{ ServiceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CameraScene' }
      responses:
        '204': { description: 后续视频帧使用新场景 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ServiceToken: { type: http, scheme: bearer }
    SessionCookie: { type: apiKey, in: cookie, name: iot_session }
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BasketNo:
      name: basketNo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FurnaceId:
      name: furnaceId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Session:
      description: 会话有效 12 小时，凭据仅通过 HttpOnly SameSite=Strict Cookie 返回
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionResponse' }
    Error:
      description: 结构化错误；message 不包含凭据或内部堆栈
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    Accepted:
      description: 请求已接收；重复请求返回同一对象，不代表设备执行完成
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Accepted' }
  schemas:
    RuleCondition:
      oneOf:
      - $ref: '#/components/schemas/RuleConditionLeaf'
      - $ref: '#/components/schemas/RuleConditionGroup'
    RuleConditionLeaf:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - condition
        field:
          type: string
          enum:
          - temperatureC
          - entryPresent
          - inFurnace
          - doorOpen
          - doorClosed
          - sensorOnline
          - doorOnline
          - lampOnline
          - temperatureOnline
          - cameraOnline
          - scanFailed
          - mesRejected
          - mesUnavailable
          - doorTimeout
          - entryTimeout
          - resetTimeout
          - workflowFault
        operator:
          type: string
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
        value:
          oneOf:
          - type: number
          - type: boolean
          description: 温度字段使用数值；其他字段使用布尔值且只允许 eq/ne
      required:
      - type
      - field
      - operator
      - value
    RuleConditionGroup:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - group
        logic:
          type: string
          enum:
