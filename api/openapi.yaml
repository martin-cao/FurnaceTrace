      tags: [Public]
      operationId: getCycle
      responses:
        '200':
          description: 周期及按发生顺序排列的事件与命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/alarms:
    get:
      tags: [Public]
      operationId: listAlarms
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: furnaceId, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: 活动及历史报警；确认和恢复为不同字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmPage' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/alarms/{alarmId}/acknowledgements:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Public]
      operationId: acknowledgeAlarm
      summary: 管理员确认已查看，不清除故障，不放行设备
      x-required-role: admin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorAction' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/notifications:
    get:
      tags: [Public]
      operationId: listNotifications
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 仅当前用户的通知投递状态；unknown 表示外部发送结果不确定
